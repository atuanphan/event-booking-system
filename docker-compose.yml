services:
  ticket_backend_service:
    build: ./backend
    image: ticket_backend_image
    container_name: ticket_backend_service
    ports:
      - "8044:8044"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy # ← đợi mysql healthy rồi mới start backend
      redis:
        condition: service_healthy # ← đợi redis healthy rồi mới start backend

  mysql:
    image: mysql:8
    container_name: mysql_ticket
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3307:3306"          # map ra 3307 để tránh đụng MySQL đang cài sẵn trên máy (đang chiếm 3306)
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis_ticket_service
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:  
  mysql-data: