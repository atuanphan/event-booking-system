spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    properties:
      #xử lý N+1 query khi select
      "[hibernate.default_batch_fetch_size]": 20 
      hibernate:
        jdbc:
           "[batch_size]": 20
        "[order_inserts]": true
        "[order_updates]": true
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: public_profile, email
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v26.0/dialog/oauth
            token-uri: https://graph.facebook.com/v26.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v26.0/me?fields=id,name,email
            user-name-attribute: id
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}
server:
  port: 8044
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}

token:
  access:
    expiry: ${ACCESS_TOKEN_EXPIRY}
  refresh:
    expiry: ${REFRESH_TOKEN_EXPIRY}

jonet:
  redirect-url: http://localhost:3000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}