spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_pro_db?rewriteBatchedStatements=true&&useSSL=false&&allowPublicKeyRetrieval=true&&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 184703
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    properties:
      #xử lý N+1 query khi select
      "[hibernate.default_batch_fetch_size]": 20 
      hibernate:
        jdbc:
           "[batch_size]": 20
        "[order_inserts]": true
        "[order_updates]": true
    hibernate:
      ddl-auto: none
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
server:
  port: 8044