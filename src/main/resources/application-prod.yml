spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    properties:
      #xử lý N+1 query khi select
      "[hibernate.default_batch_fetch_size]": 20 
      hibernate:
        jdbc:
           "[batch_size]": 20
        "[order_inserts]": true
        "[order_updates]": true
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
server:
  port: 8044